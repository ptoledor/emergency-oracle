name: Train temporal H1-H6 candidate

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "03_model/**"
      - "05_research/model_validation/tests/**"
      - "requirements.txt"
      - ".github/workflows/train-temporal-backtest.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporal-backtest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout candidate code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install temporal training dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            numpy==2.3.3 \
            pandas==2.3.2 \
            scipy==1.16.2 \
            scikit-learn==1.7.2 \
            joblib==1.5.2 \
            xgboost==3.3.0

      - name: Run temporal gate tests
        run: |
          python -m unittest discover \
            -s 05_research/model_validation/tests \
            -p "test_*.py" \
            -v

      - name: Train leakage-aware H1-H6 candidate
        env:
          OMP_NUM_THREADS: "1"
          LOKY_MAX_CPU_COUNT: "1"
          SKLEARN_NUM_THREADS: "1"
        run: python 03_model/train_walkforward_regime.py

      - name: Publish metrics summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("03_model/saved_models/walkforward_regime_direct6_xgboost_summary.json")
          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          if not path.exists():
              summary_path.write_text(
                  "## Temporal backtest\n\nTraining did not produce a summary file.\n",
                  encoding="utf-8",
              )
              raise SystemExit(0)

          data = json.loads(path.read_text(encoding="utf-8"))
          gate = data.get("promotion_gate", {})
          baselines = data.get("baselines", {})
          lines = [
              "## Temporal H1-H6 backtest",
              "",
              "| Metric | Candidate |",
              "|---|---:|",
              f"| MAE | {data.get('mae', float('nan')):.4f} |",
              f"| RMSE | {data.get('rmse', float('nan')):.4f} |",
              f"| R² | {data.get('r2', float('nan')):.4f} |",
              f"| ROC-AUC | {data.get('roc_auc', float('nan')):.4f} |",
              f"| Brier | {data.get('brier', float('nan')):.4f} |",
              "",
              "### Baselines",
              "",
              "```json",
              json.dumps(baselines, indent=2, ensure_ascii=False),
              "```",
              "",
              "### Promotion gate",
              "",
              "```json",
              json.dumps(gate, indent=2, ensure_ascii=False),
              "```",
          ]
          summary_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Upload training results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temporal-h1-h6-results-${{ github.sha }}
          path: |
            03_model/saved_models/walkforward_regime_direct6_xgboost_summary.json
            03_model/saved_models/walkforward_regime_direct6_xgboost_horizon_metrics.csv
            03_model/saved_models/walkforward_regime_direct6_xgboost_fold_metrics.csv
            03_model/saved_models/walkforward_regime_direct6_xgboost_oof_predictions.csv
            03_model/saved_models/regressor_walkforward_regime_direct6_xgboost.pkl
            03_model/saved_models/classifier_walkforward_regime_direct6_xgboost.pkl
            03_model/saved_models/metadata_walkforward_regime_direct6_xgboost.pkl
          if-no-files-found: warn
          retention-days: 7
