name: Search temporal H1-H6 candidates

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "03_model/**"
      - "05_research/model_validation/tests/**"
      - ".github/workflows/train-temporal-backtest.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporal-search-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout candidate code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install temporal search dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            numpy==2.3.3 \
            pandas==2.3.2 \
            scipy==1.16.2 \
            scikit-learn==1.7.2 \
            joblib==1.5.2

      - name: Run temporal gate tests
        run: |
          python -m unittest discover \
            -s 05_research/model_validation/tests \
            -p "test_*.py" \
            -v

      - name: Search horizon-specific robust candidates
        env:
          OMP_NUM_THREADS: "1"
          LOKY_MAX_CPU_COUNT: "1"
          SKLEARN_NUM_THREADS: "1"
        run: python 03_model/search_temporal_candidates_v2.py

      - name: Publish metrics summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("03_model/saved_models/temporal_candidate_search_v2_summary.json")
          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          if not path.exists():
              summary_path.write_text(
                  "## Temporal candidate search v2\n\nSearch did not produce a summary file.\n",
                  encoding="utf-8",
              )
              raise SystemExit(0)

          data = json.loads(path.read_text(encoding="utf-8"))
          count = data.get("candidate_count", {})
          risk = data.get("candidate_risk", {})
          gate = data.get("promotion_gate", {})
          lines = [
              "## Temporal H1-H6 candidate search v2",
              "",
              f"**Count candidates:** `{data.get('selected_count_candidates')}`",
              "",
              f"**Risk candidate:** `{data.get('selected_risk_candidate')}`",
              "",
              "| Metric | Holdout candidate |",
              "|---|---:|",
              f"| MAE | {count.get('mae', float('nan')):.4f} |",
              f"| RMSE | {count.get('rmse', float('nan')):.4f} |",
              f"| R² | {count.get('r2', float('nan')):.4f} |",
              f"| ROC-AUC | {risk.get('roc_auc', float('nan')):.4f} |",
              f"| Brier | {risk.get('brier', float('nan')):.4f} |",
              "",
              "### Promotion gate",
              "",
              "```json",
              json.dumps(gate, indent=2, ensure_ascii=False),
              "```",
          ]
          summary_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Upload search results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temporal-candidate-search-v2-${{ github.sha }}
          path: |
            03_model/saved_models/temporal_candidate_search_v2_summary.json
            03_model/saved_models/temporal_candidate_search_v2_horizon_metrics.csv
            03_model/saved_models/temporal_candidate_search_v2_leaderboard.csv
            03_model/saved_models/temporal_candidate_search_v2_holdout_predictions.csv
          if-no-files-found: warn
          retention-days: 7
